#cloud-config
# Installs the vCenter to OCI migration helper (web UI + migration engine) on Oracle Linux 9, either from
# source (git + pip) or as a podman container, generates a self-signed certificate and runs it as the
# vc-oci-helper systemd unit.
package_update: true
packages:
  - openssl
  - firewalld
%{ if install_method == "source" ~}
  - git
  - python3.11
  - python3.11-pip
%{ else ~}
  - podman
%{ endif ~}

write_files:
  - path: /etc/vc-oci-helper/helper.env
    permissions: "0600"
    content: |
      HELPER_VCENTER_HOST=${vcenter_host}
      HELPER_VCENTER_PORT=${vcenter_port}
      HELPER_VCENTER_VERIFY_SSL=${vcenter_verify_ssl}
      HELPER_OCI_AUTH=instance_principal
      HELPER_REGION=${region}
      HELPER_TENANCY_ID=${tenancy_ocid}
      HELPER_SEED_BUCKET=${seed_bucket}
      HELPER_DEFAULT_SHAPE=${default_shape}
      HELPER_MAX_CONCURRENT_JOBS=${max_concurrent_jobs}
      HELPER_LISTEN_PORT=8443
      HELPER_TLS_CERT_FILE=/etc/vc-oci-helper/server.crt
      HELPER_TLS_KEY_FILE=/etc/vc-oci-helper/server.key
      HELPER_DB_PATH=/var/lib/vc-oci-helper/jobs.sqlite3

%{ if install_method == "source" ~}
  - path: /usr/local/sbin/vc-oci-helper-install
    permissions: "0755"
    content: |
      #!/bin/bash
      # (Re)install the helper from ${source_git_url} @ ${source_git_ref}
      set -euo pipefail
      SRC=/opt/vc-oci/src
      VENV=/opt/vc-oci/venv
      mkdir -p /opt/vc-oci
      if [ -d "$SRC/.git" ]; then
        git -C "$SRC" fetch --all --tags
      else
        git clone "${source_git_url}" "$SRC"
      fi
      git -C "$SRC" checkout --force "${source_git_ref}"
      git -C "$SRC" pull --ff-only || true
      [ -d "$VENV" ] || python3.11 -m venv "$VENV"
      "$VENV/bin/pip" install --upgrade pip
      "$VENV/bin/pip" install "$SRC/helper"

  - path: /etc/systemd/system/vc-oci-helper.service
    permissions: "0644"
    content: |
      [Unit]
      Description=vCenter to OCI helper
      After=network-online.target
      Wants=network-online.target

      [Service]
      Restart=always
      RestartSec=5
      EnvironmentFile=/etc/vc-oci-helper/helper.env
      ExecStart=/opt/vc-oci/venv/bin/vc-oci-helper
      # writes to /dev/oracleoci/oraclevd* so it runs as root
      User=root

      [Install]
      WantedBy=multi-user.target
%{ else ~}
  - path: /etc/systemd/system/vc-oci-helper.service
    permissions: "0644"
    content: |
      [Unit]
      Description=vCenter to OCI helper
      After=network-online.target
      Wants=network-online.target

      [Service]
      Restart=always
      RestartSec=5
      ExecStartPre=-/usr/bin/podman rm -f vc-oci-helper
      ExecStartPre=/usr/bin/podman pull ${container_image}
      # --privileged: the container writes to paravirtualized volume devices (/dev/oracleoci/oraclevd*)
      ExecStart=/usr/bin/podman run --name vc-oci-helper --rm --privileged --network host \
        --env-file /etc/vc-oci-helper/helper.env \
        -v /etc/vc-oci-helper:/etc/vc-oci-helper:ro \
        -v /var/lib/vc-oci-helper:/var/lib/vc-oci-helper \
        -v /dev:/dev \
        ${container_image}
      ExecStop=/usr/bin/podman stop -t 30 vc-oci-helper

      [Install]
      WantedBy=multi-user.target
%{ endif ~}

runcmd:
  - mkdir -p /var/lib/vc-oci-helper /etc/vc-oci-helper
  - |
    HOSTNAME_FQDN=$(hostname -f 2>/dev/null || hostname)
    IP=$(hostname -I | awk '{print $1}')
    openssl req -x509 -newkey rsa:2048 -sha256 -days 1095 -nodes \
      -keyout /etc/vc-oci-helper/server.key -out /etc/vc-oci-helper/server.crt \
      -subj "/CN=$${HOSTNAME_FQDN}/O=vCenter-OCI helper" \
      -addext "subjectAltName=DNS:$${HOSTNAME_FQDN},IP:$${IP}"
    chmod 644 /etc/vc-oci-helper/server.crt
    chmod 600 /etc/vc-oci-helper/server.key
  - systemctl enable --now firewalld
  - firewall-cmd --permanent --add-port=8443/tcp
  - firewall-cmd --reload
%{ if install_method == "source" ~}
  - /usr/local/sbin/vc-oci-helper-install
%{ else ~}
  - |
    if [ -n "${container_registry_auth}" ]; then
      REG=$(echo "${container_image}" | cut -d/ -f1)
      USER_PART=$(echo "${container_registry_auth}" | cut -d: -f1)
      PASS_PART=$(echo "${container_registry_auth}" | cut -d: -f2-)
      echo "$PASS_PART" | podman login "$REG" -u "$USER_PART" --password-stdin
    fi
%{ endif ~}
  - systemctl daemon-reload
  - systemctl enable --now vc-oci-helper
