<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VMware to OCI Compute migration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">VMware <span class="arrow">&rarr;</span> OCI Compute migration</div>
    <nav id="nav" hidden>
      <a href="#/vms" data-nav="vms">Source VMs</a>
      <a href="#/jobs" data-nav="jobs">Jobs</a>
      <a href="#/setup" data-nav="setup">Setup</a>
    </nav>
    <div id="user" class="user" hidden>
      <span data-username></span>
      <button class="secondary small" id="logout-btn">Log out</button>
    </div>
  </header>

  <main id="app" class="app">
    <div class="loading">Loading...</div>
  </main>

  <!-- ------------------------------------------------------------------ login -->
  <template id="tpl-login">
    <section class="card login">
      <h2>Log in to vCenter</h2>
      <p class="muted">Use your vCenter credentials. The account needs read access to the inventory and
        <em>Allow disk access</em> / <em>Export</em> on the virtual machines to migrate.</p>
      <form id="login-form" class="form" autocomplete="on">
        <label>vCenter server
          <input name="vcenter" type="text" required list="vcenter-recent" placeholder="vcenter.example.com[:443]" autocapitalize="off" spellcheck="false">
          <datalist id="vcenter-recent"></datalist>
          <small>Host name or IP, optionally with a port. The helper must reach it on that port (and on 443 for the disk export).</small>
        </label>
        <label>User name
          <input name="username" type="text" required autofocus placeholder="administrator@vsphere.local">
        </label>
        <label>Password
          <input name="password" type="password" required>
        </label>
        <div class="actions">
          <span id="login-error" class="error"></span>
          <button type="submit" class="primary" id="login-btn">Log in</button>
        </div>
      </form>
    </section>
  </template>

  <!-- ------------------------------------------------------------------ VM list -->
  <template id="tpl-vms">
    <section class="card">
      <div class="toolbar">
        <h2>Source VMs</h2>
        <input id="vm-filter" type="search" placeholder="Filter by name, folder or guest OS">
        <select id="vm-folder" class="filter" title="VM folder"><option value="">All folders</option></select>
        <select id="vm-os" class="filter" title="Guest OS"><option value="">All guest OSes</option></select>
        <label class="check"><input type="checkbox" id="vm-off-only"> powered off only</label>
        <button class="secondary small" id="vm-refresh">Refresh</button>
        <span id="vm-count" class="muted"></span>
      </div>
      <div id="vm-error" class="error"></div>
      <table class="vms">
        <thead>
          <tr><th>Name</th><th>Folder</th><th>Power</th><th>Guest OS</th><th>vCPU / memory</th><th>Disks</th><th>Last job</th><th></th></tr>
        </thead>
        <tbody id="vm-rows"></tbody>
      </table>
      <div id="vm-pager" class="pager" hidden>
        <button class="secondary small" id="vm-prev">&lsaquo; Previous</button>
        <span id="vm-page-info" class="muted"></span>
        <button class="secondary small" id="vm-next">Next &rsaquo;</button>
        <label class="muted">Per page
          <select id="vm-page-size"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
        </label>
      </div>
    </section>
  </template>

  <!-- ------------------------------------------------------------------ export -->
  <template id="tpl-export">
    <div class="export">
      <section class="card" id="vm-card">
        <div class="toolbar">
          <h2>Source virtual machine</h2>
          <a href="#/vms" class="muted">&larr; back to the list</a>
        </div>
        <div id="vm-details" class="kv"></div>
        <div id="windows-driver-note" class="callout important" hidden>
          <strong>Important: Windows guest.</strong> Install the
          <a href="https://docs.oracle.com/en/operating-systems/oracle-linux/kvm-virtio/" target="_blank" rel="noopener">Oracle VirtIO Drivers for Microsoft Windows</a>
          inside the VM <strong>before</strong> you migrate it. OCI presents the boot disk and the NIC as
          paravirtualized (virtio) devices; without the drivers Windows does not find its boot disk
          (<code>INACCESSIBLE_BOOT_DEVICE</code>) and has no network after the migration.
          If the drivers cannot be installed up front, tick <em>Maximum compatibility</em> below (IDE disk + E1000 NIC)
          and install them after the first boot in OCI.
        </div>
        <ul id="vm-problems" class="problems"></ul>
        <ul id="vm-warnings" class="warnings"></ul>
      </section>

      <section class="card" id="target-card">
        <h2>OCI target</h2>
        <form id="target-form" class="form" autocomplete="off">
          <label>Compartment
            <select name="compartment_id" required></select>
            <small>Where the instance and its volumes are created.</small>
          </label>
          <label>Availability domain
            <input name="availability_domain" type="text" readonly tabindex="-1">
            <small>Fixed to the helper VM's availability domain: the volumes are written by the helper and boot volumes are AD-local.</small>
          </label>
          <label>Network compartment
            <select name="network_compartment_id" required></select>
            <small>Compartment holding the VCN and subnet (may differ from the instance compartment).</small>
          </label>
          <label>VCN
            <select name="vcn_id" required></select>
          </label>
          <label>Subnet
            <select name="subnet_id" required></select>
            <small id="subnet-hint"></small>
          </label>
          <label>Shape
            <select name="shape"></select>
            <small id="shape-hint"></small>
          </label>
          <div class="row2">
            <label>OCPUs
              <input name="ocpus" type="number" min="1" step="1" inputmode="numeric">
            </label>
            <label>Memory (GB)
              <input name="memory_gb" type="number" min="1" step="1" inputmode="numeric">
            </label>
          </div>
          <small id="sizing-hint" class="form-hint"></small>
          <label>Instance name
            <input name="display_name" type="text" maxlength="255">
          </label>
          <label id="os-version-label" hidden>Guest OS version
            <select name="operating_system_version"></select>
            <small id="os-version-hint"></small>
          </label>
          <label class="check"><input type="checkbox" name="assign_public_ip"> Assign a public IP</label>
          <label class="check"><input type="checkbox" name="start_after_migration" checked> Start the instance when the copy completes</label>

          <fieldset id="windows-fieldset" hidden>
            <legend>Windows licensing</legend>
            <label class="check"><input type="radio" name="windows_license_type" value="BRING_YOUR_OWN_LICENSE" checked> Bring your own license (BYOL)</label>
            <label class="check"><input type="radio" name="windows_license_type" value="OCI_PROVIDED"> OCI provided license</label>
            <small id="windows-license-hint">The instance is registered as Windows in OCI; the license type can be changed later.</small>
          </fieldset>

          <details>
            <summary>Advanced: disk transfer</summary>
            <label class="check"><input type="checkbox" name="nfc_direct_to_esxi"> Download the disks directly from the ESXi host <span id="esxi-host-hint"></span> instead of through vCenter</label>
            <small>Usually much faster than the vCenter proxy, but the helper must reach that ESXi host on TCP 443 (same as <code>HELPER_NFC_HOST_OVERRIDE</code>, resolved per VM).</small>
            <label class="check"><input type="checkbox" name="pipelined_decode"> Decode and write on a separate thread (keep downloading while grains are inflated and written)</label>
            <small>Overlaps the network read with decompression and the volume write instead of doing them one after another. Buffers a few chunks in memory (<code>HELPER_NFC_PIPELINE_DEPTH</code>).</small>
            <label>Volume performance (VPU/GB)
              <select name="volume_vpus_per_gb">
                <option value="10" selected>10 - Balanced (default)</option>
                <option value="20">20 - Higher Performance</option>
                <option value="30">30 - Ultra High Performance</option>
              </select>
              <small>Applied to the boot volume and every block volume created for this VM. A higher tier speeds up the copy and can be lowered in OCI afterwards.</small>
            </label>
          </details>

          <details>
            <summary>Advanced: firmware and device model</summary>
            <div class="kv" id="launch-preview"></div>
            <label class="check"><input type="checkbox" name="compatibility_mode"> Maximum compatibility (IDE boot volume + E1000 NIC) for guests without virtio drivers</label>
            <label>Boot volume type override
              <select name="boot_volume_type_override">
                <option value="">(automatic)</option>
                <option>PARAVIRTUALIZED</option><option>SCSI</option><option>IDE</option><option>ISCSI</option>
              </select>
            </label>
            <label>Network type override
              <select name="network_type_override">
                <option value="">(automatic)</option>
                <option>PARAVIRTUALIZED</option><option>E1000</option><option>VFIO</option>
              </select>
            </label>
          </details>

          <div class="actions">
            <span id="form-error" class="error"></span>
            <button type="submit" id="submit-btn" class="primary">Start migration</button>
          </div>
        </form>
      </section>

      <section class="card" id="job-card" hidden>
        <h2>Migration progress</h2>
        <div id="job-view"></div>
      </section>
    </div>
  </template>

  <!-- ------------------------------------------------------------------ setup -->
  <template id="tpl-setup">
    <div class="setup">
      <section class="card">
        <div class="toolbar">
          <h2>Software</h2>
          <button class="secondary small" id="sw-check">Check again</button>
          <span id="sw-state" class="muted"></span>
        </div>
        <div id="sw-kv" class="kv"></div>
        <div class="actions">
          <span id="sw-error" class="error"></span>
          <button class="primary" id="sw-update" hidden>Update now</button>
        </div>
        <details id="sw-log-details" hidden>
          <summary>Update log</summary>
          <pre id="sw-log" class="log"></pre>
        </details>
      </section>

      <section class="card">
        <h2>Helper</h2>
        <div id="setup-kv" class="kv"></div>
      </section>

      <section class="card">
        <h2>Operation</h2>
        <form id="op-form" class="form" autocomplete="off">
          <label>Concurrent migrations
            <input name="max_concurrent_jobs" type="number" min="1" step="1" required>
            <small id="op-concurrency-hint">Migrations copying disks at the same time; further jobs wait in the queue.
              Lowering it never interrupts a running migration.</small>
          </label>
          <label>Session idle timeout (hours)
            <input name="session_ttl_h" type="number" min="0.1" step="0.1" required>
            <small id="op-ttl-hint">A login ends after this much inactivity in the web UI. Applies to current logins
              as well; the vCenter connection of a running migration stays open until the job finishes.</small>
          </label>
          <div class="actions">
            <span id="op-result" class="muted"></span>
            <button type="submit" class="primary" id="op-save">Save</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Logging</h2>
        <form id="log-form" class="form" autocomplete="off">
          <label>Helper log level
            <select name="log_level"></select>
            <small>Level of the helper's own messages in the service journal (<code>journalctl -u vc-oci-helper -f</code>).</small>
          </label>
          <label class="check"><input type="checkbox" name="oci_log_requests"> Log OCI API requests and responses</label>
          <small>Dumps every OCI SDK call including headers and bodies. Very verbose; use it to analyse
            <em>InvalidParameter</em> and similar errors, then switch it off again.</small>
          <div class="actions">
            <span id="log-result" class="muted"></span>
            <button type="submit" class="primary" id="log-save">Save</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Maintenance</h2>
        <p class="muted">Seed images are tiny helper images used to launch the target instances. They can be
          removed at any time; the next migration recreates them.</p>
        <div class="actions">
          <span id="seed-result" class="muted"></span>
          <button class="secondary" id="seed-cleanup">Delete seed images</button>
        </div>
      </section>
    </div>
  </template>

  <!-- ------------------------------------------------------------------ job view -->
  <template id="tpl-job">
    <div class="job">
      <div class="job-head">
        <span class="phase" data-phase></span>
        <span class="msg" data-message></span>
      </div>
      <div class="transfer muted" data-transfer hidden></div>
      <div class="disks" data-disks></div>
      <div class="kv" data-oci></div>
      <div class="actions">
        <span class="error" data-error></span>
        <span class="muted" data-copy-state></span>
        <button class="secondary" data-copy title="Copy the job record, error and relevant helper log lines to the clipboard">Copy diagnostics</button>
        <button data-resume hidden title="All disks were copied; retry attaching the volumes and starting the instance">Retry finalize</button>
        <button class="secondary" data-cancel>Cancel</button>
        <select data-license hidden>
          <option value="BRING_YOUR_OWN_LICENSE">BYOL</option>
          <option value="OCI_PROVIDED">OCI provided</option>
        </select>
        <button class="secondary" data-license-btn hidden>Change license type</button>
      </div>
      <details data-diag hidden>
        <summary>Diagnostics text (select all and copy if the clipboard is not available)</summary>
        <textarea class="diag" readonly rows="16"></textarea>
      </details>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
